# The pipeline is a Node build tool, so its better-sqlite3 is compiled for the
# Node ABI — distinct from the MapOS app's Electron-ABI build, same npm version
# (so identical SQLite / FTS5 / R-tree features).
packages:
  - "."

allowBuilds:
  '@biomejs/biome': true
  better-sqlite3: true
  esbuild: true
